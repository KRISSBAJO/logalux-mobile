<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LogaLuxe customer — Search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F2;color:#1A1513;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#7A1F2B;text-decoration:none}a:hover{color:#5A1420}
*{box-sizing:border-box}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.app{width:390px;height:844px;display:flex;flex-direction:column;background:#FBF7F2;overflow:hidden;position:relative}
.body{flex:1;overflow:hidden;display:flex;flex-direction:column}
.pad{padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-ink{background:#1A1513;color:#FBF7F2}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid #EDE4DA;color:#1A1513}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;line-height:1}
.pill-gold{background:#F6EBD2;color:#7A5A12}
.pill-ok{background:#E3F2E7;color:#1F6B3A}
.card{background:#FFFFFF;border:1px solid #EDE4DA;border-radius:20px}
.photo{background:#3B1D22;position:relative;display:flex;align-items:flex-end;padding:12px;color:rgba(255,255,255,.6);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:#6B5F57}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tabbar{display:flex;justify-content:space-around;padding:10px 6px 26px;border-top:1px solid #EDE4DA;background:#FBF7F2}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:600;color:#7A6E66;min-width:60px;min-height:48px}
.tab.on{color:#1A1513}
.tab svg{width:22px;height:22px}
.chips{display:flex;gap:8px;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #E6DCD2;background:#FFFFFF;border-radius:999px;padding:0 14px;min-height:40px;font:inherit;font-size:13px;font-weight:600;color:#1A1513;white-space:nowrap;cursor:pointer}
.chip.on{background:#1A1513;color:#FBF7F2;border-color:#1A1513}
.search{display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #E6DCD2;border-radius:16px;padding:0 14px;min-height:52px}
.search input{border:0;background:transparent;font:inherit;font-size:15px;flex:1;outline:none;min-width:0;color:#1A1513}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rating{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;background:#FBF7F2;border-radius:10px;padding:6px 8px;position:absolute;top:10px;left:10px;color:#1A1513}
.rating svg{color:#D4AF5A}
.rating small{font-weight:500;color:#6B5F57;font-size:11px}
.save{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(251,247,242,.92);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1A1513}
.result{display:flex;flex-direction:column;overflow:hidden}
.result .photo{height:150px;border-radius:0}
</style>
</helmet>

<div class="app">
  <div class="body">
    <div class="pad" style="padding-top:58px">
      <div class="row" style="gap:10px">
        <a href="Main.dc.html" class="icon" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </a>
        <label class="search" style="flex:1">
          <span class="sr">Search</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input type="text" value="Knotless braids">
          <span class="muted" style="font-size:12px;white-space:nowrap">Nashville</span>
        </label>
      </div>
      <div class="chips" style="margin-top:14px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
          <button type="button" class="chip {{ f.cls }}" onClick="{{ f.pick }}">{{ f.name }}</button>
        </sc-for>
      </div>
      <div class="between" style="margin-top:16px">
        <div class="muted" style="font-size:13px"><b style="color:#1A1513">38 professionals</b> · sorted by best match</div>
        <a href="C2-Results.dc.html" class="row" style="gap:6px;font-size:13px;font-weight:600;min-height:44px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-5.3 7-12a7 7 0 1 0-14 0c0 6.7 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Map
        </a>
      </div>
    </div>

    <div class="pad" style="margin-top:12px;display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{ results }}" as="r" hint-placeholder-count="3">
        <a href="C3-Profile.dc.html" class="card result" style="color:#1A1513">
          <div class="photo" style="background:{{ r.tone }}">
            <span class="rating"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"></path></svg>{{ r.rating }} <small>({{ r.reviews }})</small></span>
            <span class="save" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg></span>
            <span>Photo: {{ r.photo }}</span>
          </div>
          <div style="padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px">
            <div class="between">
              <b style="font-size:16px">{{ r.name }}</b>
              <span class="muted" style="font-size:13px">{{ r.distance }}</span>
            </div>
            <div class="muted" style="font-size:13px">{{ r.area }} · {{ r.badge }}</div>
            <div class="between">
              <span class="pill pill-gold">Next: {{ r.next }}</span>
              <span style="font-size:14px"><span class="muted">from</span> <b style="font-size:16px">{{ r.price }}</b></span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav class="tabbar" aria-label="Tabs">
    <a href="Main.dc.html" class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="C2-Results.dc.html" class="tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</a>
    <a href="C6-Bookings.dc.html" class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>Bookings</a>
    <a href="C7-Chat.dc.html" class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5A8 8 0 1 1 21 12z"></path></svg>Inbox</a>
    <a href="C9-Account.dc.html" class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'today' }; }
  renderVals() {
    const f = this.state.f;
    const list = [['today','Available today'],['top','4.8+ rating'],['price','Price'],['mobile','Comes to you'],['deposit','No deposit']];
    const all = [
      { name: "Ada's Braid Studio", area: 'East Nashville', distance: '1.2 mi', rating: '5.0', reviews: '212', next: 'Sat 10:00', price: '$180', tone: '#3B1D22', photo: 'knotless braids', badge: 'Verified · Instant booking', today: false },
      { name: 'Knotless by Nia', area: 'Antioch', distance: '4.6 mi', rating: '4.9', reviews: '340', next: 'Today 16:30', price: '$160', tone: '#4A2A2A', photo: 'braids, side view', badge: 'Verified · Comes to you', today: true },
      { name: 'Crown & Glory Braiding', area: 'Madison', distance: '6.1 mi', rating: '4.8', reviews: '128', next: 'Today 18:00', price: '$150', tone: '#2E2538', photo: 'braiding in progress', badge: 'Verified', today: true }
    ];
    return {
      filters: list.map(([id, name]) => ({ id, name, cls: f === id ? 'on' : '', pick: () => this.setState({ f: f === id ? null : id }) })),
      results: f === 'today' ? all.filter((r) => r.today).concat(all.filter((r) => !r.today)) : all
    };
  }
}
</script>
</body>
</html>
