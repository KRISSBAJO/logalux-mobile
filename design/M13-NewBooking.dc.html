<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LogaLuxe merchant — New booking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7F2;color:#1A1513;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#7A1F2B;text-decoration:none}a:hover{color:#5A1420}
*{box-sizing:border-box}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.app{width:390px;height:844px;display:flex;flex-direction:column;background:#FBF7F2;overflow:hidden;position:relative}
.body{flex:1;overflow:hidden;display:flex;flex-direction:column}
.pad{padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-ink{background:#1A1513;color:#FBF7F2}
.btn-out{background:#FFFFFF;color:#1A1513;border-color:#E6DCD2}
.icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid #EDE4DA;color:#1A1513}
.muted{color:#6B5F57}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grp{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6B5F57;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
.grp a{letter-spacing:0;text-transform:none;font-size:12px}
.card{background:#FFFFFF;border:1px solid #EDE4DA;border-radius:18px}
.search{display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #E6DCD2;border-radius:14px;padding:0 14px;min-height:50px}
.search input{border:0;background:transparent;font:inherit;font-size:15px;flex:1;outline:none;min-width:0;color:#1A1513}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.avatar{width:40px;height:40px;border-radius:50%;background:#7A1F2B;color:#F4ECE3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.client{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #EDE4DA;font:inherit;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;color:#1A1513;min-height:56px}
.client:last-child{border-bottom:0}
.client b{display:block;font-size:14px;font-weight:600}
.client span{font-size:12px;color:#6B5F57}
.client.on{background:#F4ECE2}
.sel{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#1A1513;color:#F4ECE3;border-radius:16px}
.sel b{display:block;font-size:14px;font-weight:600}
.sel span{font-size:12px;color:#C9BCB0}
.svc{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #EDE4DA;font:inherit;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;color:#1A1513;min-height:52px}
.svc:last-child{border-bottom:0}
.svc b{display:block;font-size:14px;font-weight:600}
.svc span{font-size:12px;color:#6B5F57}
.svc .p{font-weight:700;font-size:14px}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid #1A1513;display:flex;align-items:center;justify-content:center;flex:none;color:#FBF7F2}
.check.on{background:#1A1513}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick button{border:1px solid #E6DCD2;background:#FFFFFF;border-radius:14px;min-height:52px;font:inherit;font-size:14px;font-weight:600;color:#1A1513;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pick button small{font-size:11px;color:#6B5F57;font-weight:500}
.pick button.on{background:#1A1513;color:#FBF7F2;border-color:#1A1513}
.pick button.on small{color:#C9BCB0}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #E6DCD2;border-radius:14px;background:#FFFFFF;font:inherit;text-align:left;cursor:pointer;color:#1A1513;width:100%;min-height:54px}
.opt.on{border-color:#1A1513;box-shadow:inset 0 0 0 1px #1A1513}
.opt b{display:block;font-size:14px;font-weight:600}
.opt span{font-size:12px;color:#6B5F57}
.sw{width:44px;height:26px;border-radius:999px;background:#1A1513;position:relative;flex:none;border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:21px;width:20px;height:20px;border-radius:50%;background:#FBF7F2}
.sw.off{background:#D9CFC4}
.sw.off::after{left:3px}
.bottom{padding:12px 24px 28px;border-top:1px solid #EDE4DA;background:#FBF7F2;display:flex;align-items:center;justify-content:space-between;gap:12px}
</style>
</helmet>

<div class="app">
  <div class="body">
    <div class="pad" style="padding-top:58px">
      <div class="between">
        <div class="row">
          <a href="M1-Today.dc.html" class="icon" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
          </a>
          <h1 class="serif" style="margin:0;font-size:26px;font-weight:600;line-height:1">New booking</h1>
        </div>
        <span class="muted" style="font-size:13px">Sat 10 Oct</span>
      </div>

      <div class="grp"><span>Client</span><a href="M13-NewBooking.dc.html">New client</a></div>
      <sc-if value="{{ noClient }}" hint-placeholder-val="{{ true }}">
        <label class="search"><span class="sr">Find client</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input type="text" placeholder="Name or phone" value="Da">
        </label>
        <div class="card" style="margin-top:8px">
          <sc-for list="{{ clients }}" as="c" hint-placeholder-count="3">
            <button type="button" class="client" onClick="{{ c.pick }}"><span class="avatar" style="background:{{ c.tone }}">{{ c.ini }}</span><span style="flex:1"><b>{{ c.name }}</b><span>{{ c.sub }}</span></span></button>
          </sc-for>
          <button type="button" class="client" onClick="{{ walkIn }}"><span class="avatar" style="background:#E6DCD2;color:#1A1513">+</span><span style="flex:1"><b>Walk-in, no details</b><span>Add a name later</span></span></button>
        </div>
      </sc-if>
      <sc-if value="{{ hasClient }}" hint-placeholder-val="{{ false }}">
        <div class="sel">
          <span class="avatar" style="background:#D4AF5A;color:#1A1513">{{ clientIni }}</span>
          <span style="flex:1"><b>{{ clientName }}</b><span>{{ clientSub }}</span></span>
          <button type="button" onClick="{{ clearClient }}" style="border:0;background:transparent;color:#C9BCB0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:40px">Change</button>
        </div>
      </sc-if>

      <div class="grp"><span>Services</span><span style="letter-spacing:0;text-transform:none;color:#1A1513">{{ svcTotal }}</span></div>
      <div class="card">
        <sc-for list="{{ services }}" as="s" hint-placeholder-count="4">
          <button type="button" class="svc" onClick="{{ s.pick }}">
            <span class="check {{ s.cls }}"><sc-if value="{{ s.on }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
            <span style="flex:1"><b>{{ s.name }}</b><span>{{ s.meta }}</span></span>
            <span class="p">{{ s.price }}</span>
          </button>
        </sc-for>
      </div>

      <div class="grp"><span>Time</span><a href="M8-Week.dc.html">Pick on calendar</a></div>
      <div class="pick">
        <sc-for list="{{ slots }}" as="t" hint-placeholder-count="4">
          <button type="button" class="{{ t.cls }}" onClick="{{ t.pick }}">{{ t.t }}<small>{{ t.sub }}</small></button>
        </sc-for>
      </div>

      <div class="grp"><span>Payment</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ pays }}" as="p" hint-placeholder-count="3">
          <button type="button" class="opt {{ p.cls }}" onClick="{{ p.pick }}"><span style="flex:1"><b>{{ p.name }}</b><span>{{ p.sub }}</span></span></button>
        </sc-for>
      </div>

      <div class="row" style="margin-top:16px;justify-content:space-between">
        <span style="font-size:14px"><b style="font-weight:600">Send confirmation</b><br><span class="muted" style="font-size:12px">WhatsApp, with reminders at 24 h and 2 h</span></span>
        <button type="button" class="sw {{ notifyCls }}" onClick="{{ toggleNotify }}" aria-label="Send confirmation"></button>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div>
      <div class="muted" style="font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase">{{ when }}</div>
      <div style="font-size:18px;font-weight:700">{{ summary }}</div>
    </div>
    <a href="M1-Today.dc.html" class="btn btn-ink">Create booking</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { client: null, picked: ['silk'], slot: '13:30', pay: 'visit', notify: true }; }
  renderVals() {
    const { client, picked, slot, pay, notify } = this.state;
    const people = [
      { id: 'dami', name: 'Dami Osei', sub: 'Waitlisted for today · 2 visits', ini: 'DO', tone: '#2A3A33' },
      { id: 'dara', name: 'Dara Lawal', sub: 'Last visit 3 Sep · silk press', ini: 'DL', tone: '#4A2A2A' },
      { id: 'dayo', name: 'Dayo Bankole', sub: 'New · from phone call', ini: 'DB', tone: '#1F2A33' }
    ];
    const svcRaw = [
      { id: 'silk', name: 'Silk press', meta: '1 h 30', price: '$75', n: 75, m: 90 },
      { id: 'trim', name: 'Trim', meta: '20 min · add-on', price: '$20', n: 20, m: 20 },
      { id: 'treat', name: 'Scalp treatment', meta: '20 min · add-on', price: '$25', n: 25, m: 20 },
      { id: 'knotless', name: 'Knotless braids · medium', meta: '3 h 30', price: '$180', n: 180, m: 210 }
    ];
    const chosen = svcRaw.filter((s) => picked.includes(s.id));
    const total = chosen.reduce((a, s) => a + s.n, 0), mins = chosen.reduce((a, s) => a + s.m, 0);
    const h = Math.floor(mins / 60), mm = mins % 60;
    const dur = (h ? h + ' h ' : '') + (mm ? mm + ' min' : '');
    const c = people.find((p) => p.id === client);
    const walk = client === 'walk';
    return {
      noClient: !client, hasClient: !!client,
      clients: people.map((p) => ({ ...p, pick: () => this.setState({ client: p.id }) })),
      walkIn: () => this.setState({ client: 'walk' }),
      clearClient: () => this.setState({ client: null }),
      clientName: walk ? 'Walk-in' : (c ? c.name : ''), clientSub: walk ? 'No details yet' : (c ? c.sub : ''), clientIni: walk ? 'W' : (c ? c.ini : ''),
      services: svcRaw.map((s) => { const on = picked.includes(s.id); return { ...s, on, cls: on ? 'on' : '', pick: () => this.setState({ picked: on ? picked.filter((p) => p !== s.id) : picked.concat(s.id) }) }; }),
      svcTotal: chosen.length ? '$' + total + ' · ' + dur : 'Pick at least one',
      slots: [['13:30','the open gap'],['17:50','after Bola'],['Mon 9:00','next opening'],['Custom','pick a time']].map(([t, sub]) => ({ t, sub, cls: slot === t ? 'on' : '', pick: () => this.setState({ slot: t }) })),
      pays: [['visit','Pay at the visit','Card, cash, or Tap to Pay at checkout'],['deposit','Request a deposit','Send a $40 pay link on WhatsApp now'],['card','Charge card on file','Only for clients with a saved card']]
        .map(([id, name, sub]) => ({ id, name, sub, cls: pay === id ? 'on' : '', pick: () => this.setState({ pay: id }) })),
      notifyCls: notify ? '' : 'off', toggleNotify: () => this.setState({ notify: !notify }),
      when: slot === 'Custom' ? 'Time not set' : (slot.startsWith('Mon') ? 'Mon 12 Oct' : 'Sat 10 Oct'),
      summary: (slot === 'Custom' ? '' : (slot.replace('Mon ', '') + ' · ')) + (chosen.length ? '$' + total + ' · ' + dur : 'no services')
    };
  }
}
</script>
</body>
</html>
